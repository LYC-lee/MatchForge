const plist=[];
class Pt{constructor(){this.f=cities[Math.random()*cities.length|0];this.t=cities[Math.random()*cities.length|0];while(this.t===this.f)this.t=cities[Math.random()*cities.length|0];this.p=Math.random();this.spd=0.001+Math.random()*0.003;this.s=1.5+Math.random()*2;this.oy=(Math.random()-0.5)*25;this.op=0.3+Math.random()*0.5;this.h=220+Math.random()*40;this.delay=Math.random()*100}
update(){if(this.delay>0){this.delay--;return}this.p+=this.spd;if(this.p>1){this.p=0;this.delay=Math.random()*80}}
draw(tm){if(this.delay>0)return;const p1=proj(this.f.lat,this.f.lng),p2=proj(this.t.lat,this.t.lng);if(!p1||!p2)return;

  ctx.strokeStyle=`rgba(167,139,250,${0.08})`;ctx.lineWidth=0.8;

  // 2. 锥形投影光束
  const coneGrad=ctx.createRadialGradient(px,py,0,cx,cy,ps*0.7);
  coneGrad.addColorStop(0,`rgba(99,102,241,${0.15+0.03*Math.sin(time*0.4)})`);

  ctx.fillStyle=coneGrad;ctx.fillRect(0,0,W,H);

  // 光束射线
  for(let i=0;i<20;i++){const a=Math.PI/2+(i-10)*0.08+Math.sin(time*0.2+i)*0.03,len=ps*(0.3+Math.random()*0.5),f=0.5+0.5*Math.sin(time*0.6+i*1.5);
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(a)*len,py-Math.sin(a)*len);

  // 中心主光柱
  ctx.beginPath();ctx.moveTo(px-3,py);ctx.lineTo(px+3,py);ctx.lineTo(px+10,py-ps*0.7);ctx.lineTo(px-10,py-ps*0.7);ctx.closePath();
  const cg=ctx.createLinearGradient(px,py,px,py-ps*0.7);
  cg.addColorStop(0,`rgba(150,150,255,${0.10})`);cg.addColorStop(0.5,`rgba(100,100,255,${0.05})`);cg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=cg;ctx.fill();

  // 3. 全息中国版图
  chinaPolys.forEach(poly=>{
    const pts=[];let ok=true;
    for(const p of poly){const gp=proj(p[0],p[1]);if(!gp){ok=false;break}pts.push(gp)}
    if(!ok||pts.length<3)return;
    ctx.beginPath();pts.forEach((p,i)=>{i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.closePath();
    const holo=0.10+0.04*Math.sin(time*0.5);
    ctx.fillStyle=`rgba(99,102,241,${holo})`;ctx.fill();
    ctx.save();ctx.shadowColor=`rgba(99,102,241,${0.3+0.15*Math.sin(time*0.6)})`;ctx.shadowBlur=25+12*Math.sin(time*0.6);
    ctx.strokeStyle=`rgba(129,140,248,${0.5+0.15*Math.sin(time*0.6)})`;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    ctx.strokeStyle=`rgba(99,102,241,${0.6+0.2*Math.sin(time*0.8)})`;ctx.lineWidth=0.8;ctx.stroke();
    // 扫描线
    ctx.save();ctx.clip();
    const scanY=(time*50)%(H*1.2)-H*0.1;
    ctx.strokeStyle=`rgba(150,150,255,${0.06+0.03*Math.sin(time*0.3)})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,scanY);ctx.lineTo(W,scanY);ctx.stroke();ctx.restore()
  });

  // 4. 城市光点
  cities.forEach(city=>{
    const pos=proj(city.lat,city.lng);if(!pos)return;
    const a=Math.min(1,Math.max(0.3,(pos.z+0.3)/1.3));
    const gg=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,8);
    gg.addColorStop(0,`rgba(150,150,255,${0.08*a})`);gg.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(pos.x,pos.y,8,0,6.28);ctx.fillStyle=gg;ctx.fill();
    ctx.beginPath();ctx.arc(pos.x,pos.y,2+Math.sin(time+city.lat),0,6.28);
    ctx.strokeStyle=`rgba(167,139,250,${0.1*a})`;ctx.lineWidth=0.8;ctx.stroke();
    ctx.beginPath();ctx.arc(pos.x,pos.y,1.5,0,6.28);
    ctx.fillStyle=`rgba(199,210,254,${0.7*a})`;ctx.fill();
    if(a>0.5){ctx.fillStyle=`rgba(255,255,255,${0.25*a})`;ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(city.name,pos.x,pos.y+4)}
  });

  // 5. 粒子
  plist.forEach(p=>{p.update();p.draw(time)});

  // 6. HUD
  ctx.fillStyle='rgba(99,102,241,0.04)';ctx.font='10px monospace';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('// HOLOGRAPHIC PROJECTION',14,14);

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
