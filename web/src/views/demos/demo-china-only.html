// 经纬度转屏幕坐标
function project(lat, lng) {
  const margin = 0.04;
  const range = 0.91;
  const cw = W, ch = H;
  const lngMin = 72, lngMax = 136, latMin = 2, latMax = 55;
  // 地图居中并填充
  const x = cw * (margin + range * (lng - lngMin) / (lngMax - lngMin));
  const y = ch * (margin + range * (1 - (lat - latMin) / (latMax - latMin)));
  return { x, y };
}

// 城市坐标
const cities = [
  { name: '深圳', lat:22.5, lng:114.1, r:1.0 },
  { name: '上海', lat:31.2, lng:121.5, r:0.9 },
  { name: '北京', lat:39.9, lng:116.4, r:0.9 },
  { name: '苏州', lat:31.3, lng:120.6, r:0.7 },
  { name: '成都', lat:30.6, lng:104.1, r:0.7 },
  { name: '广州', lat:23.1, lng:113.3, r:0.7 },
  { name: '武汉', lat:30.6, lng:114.3, r:0.6 },
  { name: '杭州', lat:30.3, lng:120.2, r:0.6 },
  { name: '西安', lat:34.3, lng:108.9, r:0.6 },
  { name: '重庆', lat:29.6, lng:106.5, r:0.6 },
  { name: '南京', lat:32.1, lng:118.8, r:0.6 },
  { name: '东莞', lat:23.0, lng:113.8, r:0.7 },
];

// ===== 粒子系统 =====
const particles = [];

class Particle {
  constructor() {
    this.from = cities[Math.random()*cities.length|0];
    this.to = cities[Math.random()*cities.length|0];
    while (this.to === this.from) this.to = cities[Math.random()*cities.length|0];
    this.p = Math.random();
    this.spd = 0.001 + Math.random() * 0.003;
    this.s = 1.5 + Math.random() * 2;
    this.oy = (Math.random()-0.5)*30;
    this.op = 0.3 + Math.random() * 0.5;
    this.h = 220 + Math.random() * 40;
    this.delay = Math.random() * 100;
  }
  update() {
    if (this.delay > 0) { this.delay--; return; }
    this.p += this.spd;
    if (this.p > 1) { this.reset(); }
  }
  reset() {
    this.from = cities[Math.random()*cities.length|0];
    this.to = cities[Math.random()*cities.length|0];
    while (this.to === this.from) this.to = cities[Math.random()*cities.length|0];
    this.p = 0;
    this.delay = Math.random() * 80;
  }
  draw(time) {
    if (this.delay > 0) return;
    const p1 = project(this.from.lat, this.from.lng);
    const p2 = project(this.to.lat, this.to.lng);
    const p = this.p;
    const cx = (p1.x+p2.x)/2, cy = (p1.y+p2.y)/2 - 20 + this.oy;
    const x = (1-p)*(1-p)*p1.x + 2*(1-p)*p*cx + p*p*p2.x;
    const y = (1-p)*(1-p)*p1.y + 2*(1-p)*p*cy + p*p*p2.y;
    const a = Math.sin(p*Math.PI)*this.op;
    const r = this.s*(0.5+0.5*Math.sin(p*Math.PI));

    // Glow
    const g = ctx.createRadialGradient(x,y,0,x,y,r*6);
    g.addColorStop(0, `hsla(${this.h},80%,70%,${a*0.15})`);
    g.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(x,y,r*6,0,6.28); ctx.fillStyle = g; ctx.fill();

    ctx.beginPath(); ctx.arc(x,y,r,0,6.28);
    ctx.fillStyle = `hsla(${this.h},80%,70%,${a})`; ctx.fill();

    // Trail
    for(let j=1;j<=3;j++) {
      const tp=p-j*0.025; if(tp<=0) continue;
      const tx=(1-tp)*(1-tp)*p1.x+2*(1-tp)*tp*cx+tp*tp*p2.x;
      const ty=(1-tp)*(1-tp)*p1.y+2*(1-tp)*tp*cy+tp*tp*p2.y;
      const ta=Math.sin(tp*Math.PI)*this.op*(0.1-j*0.025);
      ctx.beginPath(); ctx.arc(tx,ty,r*(1-j*0.2),0,6.28);
      ctx.fillStyle = `hsla(${this.h},80%,70%,${Math.max(0,ta)})`; ctx.fill();
    }
  }
}

for (let i = 0; i < 20; i++) particles.push(new Particle());

// ===== 主循环 =====
function draw(t) {
  const time = t * 0.001;
  ctx.clearRect(0, 0, W, H);

  // ---- Grid overlay ----
  ctx.strokeStyle = 'rgba(99,102,241,0.02)'; ctx.lineWidth = 0.5;
  for (let i = 0; i < W; i += 30) {
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke();
  }
  for (let i = 0; i < H; i += 30) {
    ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(W,i); ctx.stroke();
  }

  // ---- Draw China polygons ----
  chinaPolys.forEach(poly => {
    const pts = poly.map(p => project(p[0], p[1]));

    // Fill
    ctx.beginPath();
    pts.forEach((p, i) => { i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y); });
    ctx.closePath();

    const pulse = 0.04 + 0.015 * Math.sin(time * 0.6);
    ctx.fillStyle = `rgba(99,102,241,${pulse})`;
    ctx.fill();

    // Glow border
    ctx.save();
    ctx.shadowColor = `rgba(99,102,241,${0.15 + 0.1 * Math.sin(time * 0.6)})`;
    ctx.shadowBlur = 15 + 8 * Math.sin(time * 0.6);
    ctx.strokeStyle = `rgba(99,102,241,${0.35 + 0.1 * Math.sin(time * 0.6)})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // Inner glow line
    ctx.strokeStyle = `rgba(129,140,248,${0.5 + 0.2 * Math.sin(time * 0.8)})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  });

  // ---- City connections ----
  for (let i = 0; i < cities.length; i++) {
    for (let j = i + 1; j < cities.length; j++) {
      if (Math.random() > 0.1) continue;
      const p1 = project(cities[i].lat, cities[i].lng);
      const p2 = project(cities[j].lat, cities[j].lng);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo((p1.x+p2.x)/2, (p1.y+p2.y)/2-15, p2.x, p2.y);
      ctx.strokeStyle = `rgba(99,102,241,${0.015 + 0.01 * Math.sin(time + i)})`;
      ctx.lineWidth = 0.5; ctx.stroke();
    }
  }

  // ---- City dots ----
  cities.forEach(city => {
    const pos = project(city.lat, city.lng);
    const glow = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, city.r * 10);
    glow.addColorStop(0, `rgba(99,102,241,${0.08 + 0.04 * Math.sin(time*1.2 + city.lat)})`);
    glow.addColorStop(1, 'transparent');
    ctx.beginPath(); ctx.arc(pos.x, pos.y, city.r * 10, 0, 6.28);
    ctx.fillStyle = glow; ctx.fill();

    ctx.beginPath(); ctx.arc(pos.x, pos.y, city.r * (2 + 0.5*Math.sin(time*1.5 + city.lng)), 0, 6.28);
    ctx.strokeStyle = `rgba(167,139,250,${0.15 + 0.1*Math.sin(time*1.5 + city.lng)})`;
    ctx.lineWidth = 1; ctx.stroke();

    ctx.beginPath(); ctx.arc(pos.x, pos.y, city.r * 2, 0, 6.28);
    const g = ctx.createRadialGradient(pos.x-city.r*0.5, pos.y-city.r*0.5, 0, pos.x, pos.y, city.r*2);
    g.addColorStop(0, 'rgba(199,210,254,0.9)');
    g.addColorStop(0.5, 'rgba(99,102,241,0.8)');
    g.addColorStop(1, 'rgba(79,70,229,0.4)');
    ctx.fillStyle = g; ctx.fill();

    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.2*Math.sin(time + city.lat)})`;
    ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(city.name, pos.x, pos.y + city.r * 2 + 4);
  });

  // ---- Particles ----
  particles.forEach(p => { p.update(); p.draw(time); });

  // ---- HUD overlay ----
  ctx.fillStyle = 'rgba(99,102,241,0.04)';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('// CHINA TERRITORY', 14, 14);
  ctx.fillText('// MATCHFORGE · AI SOURCING', 14, 28);

  requestAnimationFrame(draw);
}
