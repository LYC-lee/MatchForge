<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .mock-form .sub { color: #626978; font-size: 13px; margin-bottom: 24px; }

import * as THREE from 'three';

const container = document.getElementById('globe-container');
const W = container.clientWidth;
const H = container.clientHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000103);

const cam = new THREE.PerspectiveCamera(45, W/H, 0.1, 100);
cam.position.set(0, 0.15, 3.2);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0x0a1a2a, 1.0);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0x6366f1, 0.8);
dirLight.position.set(2, 3, 4);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x818cf8, 0.3);
fillLight.position.set(-2, -1, -3);
scene.add(fillLight);

const R = 1, group = new THREE.Group(); scene.add(group);

function ll2p(lat,lng,r) {
  const phi=(90-lat)*Math.PI/180, theta=(lng+180)*Math.PI/180;
  return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}

// 1. 低多边形球体
const lowMat = new THREE.MeshPhongMaterial({
  color: 0x0a0a1a, emissive: 0x0a0a2a, emissiveIntensity: 0.2,
  transparent: true, opacity: 0.25, flatShading: true, side: THREE.DoubleSide,
});
const lowMesh = new THREE.Mesh(new THREE.SphereGeometry(R*0.97, 24, 16), lowMat);
group.add(lowMesh);

// 2. 线框图
const wireMat = new THREE.MeshBasicMaterial({
  color: 0x6366f1, wireframe: true, transparent: true, opacity: 0.06,
});
const wireMesh = new THREE.Mesh(new THREE.SphereGeometry(R*0.98, 24, 16), wireMat);
group.add(wireMesh);

// 3. 像素点阵
const dotTex = (() => {
  const c=document.createElement('canvas'); c.width=8; c.height=8;
  const ct=c.getContext('2d');
  ct.fillStyle='#6366f1'; ct.fillRect(0,0,8,8);
  return new THREE.CanvasTexture(c);
})();

const dotSprites = [];
for (let i = 0; i < 300; i++) {
  const golden = (1+Math.sqrt(5))/2;
  const theta = 2*Math.PI*i/golden;
  const phi = Math.acos(1-2*(i+0.5)/300);
  const lat = 90 - phi*180/Math.PI;
  const lng = theta*180/Math.PI;
  const pos = ll2p(lat, lng, R*1.002);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: dotTex, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, color: 0x6366f1,
  }));
  sp.position.copy(pos);
  sp.scale.set(0.01, 0.01, 1);
  sp.userData = { phase: Math.random()*100, lat, lng };
  group.add(sp);
  dotSprites.push(sp);
}

// 4. 轨道环
for (let i = 0; i < 3; i++) {
  const pts = [];
  const r = R * (1.2 + i*0.12);
  for (let j = 0; j <= 80; j++) {
    const a = j/80*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r*0.08, Math.sin(a)*r));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: [0x6366f1, 0x818cf8, 0xa78bfa][i],
    transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending,
  });
  const line = new THREE.Line(geo, mat);
  line.rotation.x = 0.3 + i*0.25;
  line.rotation.z = i*0.15;
  line.userData = { rotSpeed: 0.0003+i*0.0002 };
  group.add(line);
}

// 绘制所有多边形
function drawChinaPolygon(poly) {
  const pts = poly.map(p => ll2p(p[0], p[1], R*1.004));
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending });
  group.add(new THREE.Line(geo, mat));

  // 发光外扩
  const gpts = poly.map(p => ll2p(p[0], p[1], R*1.01));
  const ggeo = new THREE.BufferGeometry().setFromPoints(gpts);
  const gmat = new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending });
  group.add(new THREE.Line(ggeo, gmat));

  // 仅大陆和海南台湾做填充
  if (poly.length > 20) {
    const fp = poly.map(p => ll2p(p[0],p[1],R*1.002));
    const fg = new THREE.BufferGeometry();
    const fv=[]; fp.forEach(p=>fv.push(p.x,p.y,p.z));
    const fi=[]; for(let i=1;i<fp.length-1;i++) fi.push(0,i,i+1);
    fg.setAttribute('position',new THREE.Float32BufferAttribute(fv,3));
    fg.setIndex(fi);
    fg.computeVertexNormals();
    const fm = new THREE.MeshBasicMaterial({ color: 0x818cf8, transparent: true, opacity: 0.025, side: THREE.DoubleSide, depthWrite: false });
    group.add(new THREE.Mesh(fg, fm));
  }
}

chinaPolys.forEach(poly => drawChinaPolygon(poly));

  sp.position.copy(pos);
  sp.scale.set(0.025, 0.025, 1);
  sp.userData = { phase: Math.random()*100 };
  group.add(sp);
});

// 7. 数字雨
const chars = '01アイウエオカキクケコ';
function makeCharTex(ch) {
  const c=document.createElement('canvas'); c.width=16; c.height=16;
  const ct=c.getContext('2d');
  ct.fillStyle='rgba(99,102,241,0.6)'; ct.font='10px monospace'; ct.textAlign='center'; ct.textBaseline='middle';
  ct.fillText(ch, 8, 8);
  return new THREE.CanvasTexture(c);
}
const rainDrops = [];
cnCities.forEach((ct, ci) => {
  for (let i = 0; i < 2; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: makeCharTex(chars[Math.random()*chars.length|0]),
      blending: THREE.AdditiveBlending, transparent: true, depthWrite: false,
    }));
    const pos = ll2p(ct.lat, ct.lng, R*1.01);
    sp.position.copy(pos);
    sp.scale.set(0.015, 0.015, 1);
    sp.userData = {
      phase: Math.random()*100, speed: 0.2+Math.random()*0.3,
      height: 0.08+Math.random()*0.15, startPos: pos.clone(),
      dir: pos.clone().normalize(),
    };
    group.add(sp);
    rainDrops.push(sp);
  }
});

// 8. 流动粒子
const flowList = [];
function makeFTex() {
  const c=document.createElement('canvas'); c.width=16; c.height=16;
  const ct=c.getContext('2d');
  const g=ct.createRadialGradient(8,8,0,8,8,8);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ct.fillStyle=g; ct.fillRect(0,0,16,16);
  return new THREE.CanvasTexture(c);
}
const fTex = makeFTex();

const intCities = [
  {lat:35.7,lng:139.7},{lat:37.6,lng:127},{lat:1.4,lng:103.8},
  {lat:37.4,lng:-122.1},{lat:50.1,lng:8.7},{lat:51.5,lng:-0.1},
  {lat:25.0,lng:121.5},{lat:13.8,lng:100.5},{lat:-33.9,lng:151.2},
];

function addFlow(fromList, toList, count) {
  for (let i = 0; i < count; i++) {
    const a = fromList[Math.random()*fromList.length|0];
    const b = toList[Math.random()*toList.length|0];
    const p1 = ll2p(a.lat,a.lng,R), p2 = ll2p(b.lat,b.lng,R);
    const mid = p1.clone().add(p2).multiplyScalar(0.5).normalize().multiplyScalar(R+0.12+Math.random()*0.1);
    const curve = new THREE.QuadraticBezierCurve3(p1, mid, p2);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: fTex, blending: THREE.AdditiveBlending, transparent: true,
      depthWrite: false, color: 0x6366f1,
    }));
    sp.scale.set(0.015, 0.015, 1);
    group.add(sp);
    flowList.push({ sp, curve, p: Math.random(), spd: 0.001+Math.random()*0.003 });
  }
}
addFlow(cnCities, cnCities, 6);
addFlow(cnCities, intCities, 4);

// 动画
let rot = 0;
function animate() {
  requestAnimationFrame(animate);
  rot += 0.0006;
  group.rotation.y = rot;

  group.children.forEach(child => {
    if (child.userData && child.userData.rotSpeed) {
      child.rotation.x += child.userData.rotSpeed;
    }
  });

  const t = Date.now() * 0.001;

  dotSprites.forEach(sp => {
    const f = Math.sin(t*2+sp.userData.phase) > 0.3;
    sp.material.opacity = f ? 0.5+0.4*Math.sin(t*0.5+sp.userData.phase) : 0.03;
    const s = f ? 0.01 : 0.003;
    sp.scale.set(s, s, 1);
  });

  rainDrops.forEach(sp => {
    const d = sp.userData;
    d.phase += d.speed * 0.03;
    const offset = Math.sin(d.phase) * d.height;
    sp.position.copy(d.startPos).add(d.dir.clone().multiplyScalar(offset*0.3));
    if (Math.random() < 0.008) {
      sp.material.map = makeCharTex(chars[Math.random()*chars.length|0]);
      sp.material.needsUpdate = true;
    }
  });

  flowList.forEach(fp => {
    fp.p += fp.spd; if(fp.p>1) fp.p=0;
    const pos = fp.curve.getPoint(fp.p);
    fp.sp.position.copy(pos);
    const s = 0.008+0.012*Math.sin(fp.p*Math.PI);
    fp.sp.scale.set(s,s,1);
  });

  // 中国轮廓呼吸 (所有中国线)
  const breathe = 0.5+0.3*Math.sin(t*0.6);
  group.children.forEach(child => {
    if (child.isLine && child.material.color.getHex() === 0x818cf8) {
      child.material.opacity = breathe;
    }
  });

  group.children.forEach(child => {
    if (child.isSprite && child.material.map === dotTex && child.scale.x > 0.02) {
      const s = 0.018+0.01*Math.sin(t*1.2+(child.userData.phase||0));
      child.scale.set(s, s, 1);
    }
  });

  renderer.render(scene, cam);
}
animate();

window.addEventListener('resize', ()=>{
  const w=container.clientWidth, h=container.clientHeight;
  cam.aspect=w/h; cam.updateProjectionMatrix(); renderer.setSize(w,h);
});
</script>
