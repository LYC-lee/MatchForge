const toR=d=>d*Math.PI/180,CLNG=103,CLAT=35;
function proj(lat,lng){
  const p=toR(lat),l=toR(lng),p0=toR(CLAT),l0=toR(CLNG);
  const cp=Math.cos(p),sp=Math.sin(p),cd=Math.cos(l-l0),sd=Math.sin(l-l0),cp0=Math.cos(p0),sp0=Math.sin(p0);
  const x3=cp*sd,y3=cp0*sp-sp0*cp*cd,z3=sp0*sp+cp0*cp*cd;
  if(z3<0)return null;
  const s=Math.min(W,H)*0.9,ox=W/2,oy=H/2+10;
  return{x:ox+x3*s,y:oy-y3*s,z:z3};
}

const particles=[];
class P2{constructor(){this.f=cities[Math.random()*cities.length|0];this.t=cities[Math.random()*cities.length|0];while(this.t===this.f)this.t=cities[Math.random()*cities.length|0];this.p=Math.random();this.spd=0.001+Math.random()*0.003;this.s=1.5+Math.random()*2;this.oy=(Math.random()-0.5)*25;this.op=0.3+Math.random()*0.5;this.h=220+Math.random()*40;this.delay=Math.random()*100}
update(){if(this.delay>0){this.delay--;return}this.p+=this.spd;if(this.p>1){this.p=0;this.delay=Math.random()*80}}
draw(tm){if(this.delay>0)return;const p1=proj(this.f.lat,this.f.lng),p2=proj(this.t.lat,this.t.lng);if(!p1||!p2)return;
const p=this.p,cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2-15+this.oy;const x=(1-p)*(1-p)*p1.x+2*(1-p)*p*cx+p*p*p2.x,y=(1-p)*(1-p)*p1.y+2*(1-p)*p*cy+p*p*p2.y;const a=Math.sin(p*Math.PI)*this.op,r=this.s*(0.5+0.5*Math.sin(p*Math.PI));
const g=ctx.createRadialGradient(x,y,0,x,y,r*6);g.addColorStop(0,`hsla(${this.h},80%,70%,${a*0.15})`);g.addColorStop(1,'transparent');

ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fillStyle=`hsla(${this.h},80%,70%,${a})`;ctx.fill();
for(let j=1;j<=3;j++){const tp=p-j*0.025;if(tp<=0)continue;const tx=(1-tp)*(1-tp)*p1.x+2*(1-tp)*tp*cx+tp*tp*p2.x,ty=(1-tp)*(1-tp)*p1.y+2*(1-tp)*tp*cy+tp*tp*p2.y;const ta=Math.sin(tp*Math.PI)*this.op*(0.1-j*0.025);ctx.beginPath();ctx.arc(tx,ty,r*(1-j*0.2),0,6.28);ctx.fillStyle=`hsla(${this.h},80%,70%,${Math.max(0,ta)})`;ctx.fill();}}}
for(let i=0;i<20;i++)particles.push(new P2());

function draw(t){
  const time=t*0.001;
  ctx.clearRect(0,0,W,H);

  const cx=W/2, cy=H/2+10;
  const ps=Math.min(W,H)*0.9;

  // ── 1. 全息投影底座 (底部投影仪) ──
  const px=cx, py=H-30;

  // 底座光晕
  const bg=ctx.createRadialGradient(px,py,0,px,py,35);
  bg.addColorStop(0,`rgba(99,102,241,${0.15+0.05*Math.sin(time*0.5)})`);
  bg.addColorStop(0.4,`rgba(99,102,241,${0.06})`);
  bg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=bg;ctx.fillRect(px-35,py-35,70,45);

  // 底座圆环
  ctx.strokeStyle=`rgba(99,102,241,${0.12+0.04*Math.sin(time*0.7)})`;
  ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(px,py,12,0,6.28);ctx.stroke();
  ctx.strokeStyle=`rgba(167,139,250,${0.08})`;ctx.lineWidth=0.8;
  ctx.beginPath();ctx.arc(px,py,18,0,6.28);ctx.stroke();

  // ── 2. 锥形投影光束 (从投影仪向上扩散) ──
  const beamH = ps * 1.1;
  const beamW = ps * 0.55;

  // 主光束
  const coneGrad = ctx.createRadialGradient(px, py, 0, cx, cy, beamW*1.2);
  coneGrad.addColorStop(0, `rgba(99,102,241,${0.15+0.03*Math.sin(time*0.4)})`);
  coneGrad.addColorStop(0.2, `rgba(80,80,220,${0.10})`);
  coneGrad.addColorStop(0.4, `rgba(60,60,180,${0.06})`);
  coneGrad.addColorStop(0.6, `rgba(40,40,120,${0.03})`);
  coneGrad.addColorStop(0.8, `rgba(20,20,80,${0.01})`);
  coneGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = coneGrad;
  ctx.fillRect(cx-beamW, py-beamH, beamW*2, beamH);

  // 光束射线 (加强)
  for(let i=0;i<20;i++){
    const angle=Math.PI/2+(i-10)*0.08+Math.sin(time*0.2+i)*0.03;
    const len=ps*(0.3+Math.random()*0.5);
    const flicker=0.5+0.5*Math.sin(time*0.6+i*1.5);
    ctx.beginPath();ctx.moveTo(px,py);
    ctx.lineTo(px+Math.cos(angle)*len, py-Math.sin(angle)*len);
    ctx.strokeStyle=`rgba(130,130,255,${0.02*flicker})`;
    ctx.lineWidth=1+Math.random()*2;ctx.stroke();
  }

  // 中心主光柱
  ctx.beginPath();ctx.moveTo(px-3,py);ctx.lineTo(px+3,py);ctx.lineTo(px+10,py-beamH*0.8);ctx.lineTo(px-10,py-beamH*0.8);ctx.closePath();
  const cg=ctx.createLinearGradient(px,py,px,py-beamH*0.8);
  cg.addColorStop(0,`rgba(150,150,255,${0.10})`);
  cg.addColorStop(0.5,`rgba(100,100,255,${0.05})`);
  cg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=cg;ctx.fill();

  // ── 3. 投影版图 (全息效果) ──
  chinaPolys.forEach(poly=>{
    const pts=[];let ok=true;
    for(const p of poly){const gp=proj(p[0],p[1]);if(!gp){ok=false;break}pts.push(gp)}
    if(!ok||pts.length<3)return;

    ctx.beginPath();pts.forEach((p,i)=>{i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)});ctx.closePath();

    // 全息填充 (发光半透明)
    const hologram = 0.10 + 0.04 * Math.sin(time * 0.5);
    ctx.fillStyle=`rgba(99,102,241,${hologram})`;ctx.fill();

    // 发光边框
    ctx.save();ctx.shadowColor=`rgba(99,102,241,${0.3+0.15*Math.sin(time*0.6)})`;ctx.shadowBlur=25+12*Math.sin(time*0.6);
    ctx.strokeStyle=`rgba(129,140,248,${0.5+0.15*Math.sin(time*0.6)})`;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    ctx.strokeStyle=`rgba(99,102,241,${0.6+0.2*Math.sin(time*0.8)})`;ctx.lineWidth=0.8;ctx.stroke();

    // 全息扫描线 (水平)
    ctx.save();ctx.clip();
    const scanY = (time * 50) % (H * 1.2) - H * 0.1;
    ctx.strokeStyle=`rgba(150,150,255,${0.06+0.03*Math.sin(time*0.3)})`;
    ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,scanY);ctx.lineTo(W,scanY);ctx.stroke();
    ctx.restore();
  });

  // ── 4. 城市光点 ──
  cities.forEach(city=>{
    const pos=proj(city.lat,city.lng);if(!pos)return;
    const a=Math.min(1,Math.max(0.3,(pos.z+0.3)/1.3));
    const gg=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,8);
    gg.addColorStop(0,`rgba(150,150,255,${0.08*a})`);gg.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(pos.x,pos.y,8,0,6.28);ctx.fillStyle=gg;ctx.fill();
    ctx.beginPath();ctx.arc(pos.x,pos.y,2+Math.sin(time+city.lat),0,6.28);
    ctx.strokeStyle=`rgba(167,139,250,${0.1*a})`;ctx.lineWidth=0.8;ctx.stroke();
    ctx.beginPath();ctx.arc(pos.x,pos.y,1.5,0,6.28);
    ctx.fillStyle=`rgba(199,210,254,${0.7*a})`;ctx.fill();
    if(a>0.5){ctx.fillStyle=`rgba(255,255,255,${0.25*a})`;ctx.font='9px sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(city.name,pos.x,pos.y+4)}
  });

  // ── 5. 粒子流动 ──
  particles.forEach(p=>{p.update();p.draw(time)});

  // ── 6. 数据 HUD ──
  ctx.fillStyle='rgba(99,102,241,0.04)';ctx.font='10px monospace';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('// HOLOGRAPHIC PROJECTION',14,14);

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
